name: Bug report
description: 报告一个问题，帮助我们改进
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ 请勿在此粘贴任何 token / agentId / deviceId 或 `data/` 目录内容（Issue 公开可见）。日志请先脱敏。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 版本号或 commit（`git log -1 --oneline`）
      placeholder: v0.1.0 / abc1234
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: 运行环境
      options:
        - macOS 本机
        - Linux 服务器
        - Docker 容器
        - 其他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 1. ... 2. ... 3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志（脱敏后）
      description: 相关日志片段，请先删除任何身份信息
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图（脱敏）、环境细节等
